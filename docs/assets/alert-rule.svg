<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Proposed alert rule: one alert per crossing, silent re-crosses inside the reset band, re-arm above it">
  <rect width="960" height="420" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="40" font-size="19" font-weight="700" fill="#f1f5f9">Alert rule with a reset band (hysteresis)</text>
    <text x="32" y="62" font-size="13" fill="#64748b">Proposed design for M3. Illustrative price path, not implemented yet.</text>

    <!-- reset band -->
    <rect x="80" y="180" width="820" height="40" fill="#f59e0b" opacity="0.10"/>
    <line x1="80" y1="180" x2="900" y2="180" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="4 5"/>
    <line x1="80" y1="220" x2="900" y2="220" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="72" y="184" text-anchor="end" font-size="12" fill="#a3a3a3">£82.39</text>
    <text x="72" y="224" text-anchor="end" font-size="12" fill="#fbbf24">£79.99</text>
    <text x="88" y="174" font-size="12" fill="#a3a3a3">re-arm (+3%)</text>
    <text x="88" y="238" font-size="12" fill="#fbbf24">threshold</text>

    <!-- state strip -->
    <rect x="80" y="330" width="246" height="26" rx="4" fill="#0c4a6e"/>
    <text x="203" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#7dd3fc">ARMED</text>
    <rect x="326" y="330" width="300" height="26" rx="4" fill="#78350f"/>
    <text x="476" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#fcd34d">FIRED (silent)</text>
    <rect x="626" y="330" width="175" height="26" rx="4" fill="#0c4a6e"/>
    <text x="713" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#7dd3fc">ARMED</text>
    <rect x="801" y="330" width="99" height="26" rx="4" fill="#78350f"/>
    <text x="850" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#fcd34d">FIRED</text>

    <!-- price -->
    <path d="M80 110 L150 125 L220 150 L290 190 L340 232 L390 210 L440 236 L490 214 L540 240 L590 205 L640 170 L690 140 L740 165 L790 215 L840 238 L900 230" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- alert 1 -->
    <circle cx="326" cy="220" r="14" fill="#f59e0b" opacity="0.25"/>
    <circle cx="326" cy="220" r="6.5" fill="#f59e0b"/>
    <rect x="266" y="84" width="120" height="28" rx="7" fill="#f59e0b"/>
    <text x="326" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1917">🔔 alert #1</text>
    <line x1="326" y1="112" x2="326" y2="206" stroke="#f59e0b" stroke-width="1.3"/>

    <!-- silent re-crosses -->
    <g fill="none" stroke="#94a3b8" stroke-width="2">
      <circle cx="409" cy="220" r="5"/>
      <circle cx="502" cy="220" r="5"/>
    </g>
    <text x="455" y="290" text-anchor="middle" font-size="12" fill="#94a3b8">re-crosses inside the band: no alert</text>
    <line x1="409" y1="227" x2="440" y2="276" stroke="#475569" stroke-dasharray="3 3"/>
    <line x1="502" y1="227" x2="470" y2="276" stroke="#475569" stroke-dasharray="3 3"/>

    <!-- re-arm -->
    <circle cx="626" cy="180" r="6" fill="#0f172a" stroke="#7dd3fc" stroke-width="2.5"/>
    <text x="634" y="132" font-size="12" fill="#7dd3fc">price clears band → re-arm</text>
    <line x1="636" y1="137" x2="628" y2="172" stroke="#7dd3fc" stroke-width="1"/>

    <!-- alert 2 -->
    <circle cx="801" cy="220" r="14" fill="#f59e0b" opacity="0.25"/>
    <circle cx="801" cy="220" r="6.5" fill="#f59e0b"/>
    <rect x="741" y="84" width="120" height="28" rx="7" fill="#f59e0b"/>
    <text x="801" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1917">🔔 alert #2</text>
    <line x1="801" y1="112" x2="801" y2="206" stroke="#f59e0b" stroke-width="1.3"/>

    <text x="80" y="392" font-size="13" fill="#64748b">4 downward crossings → 2 notifications. Each one goes through the outbox, so a crash never sends it twice.</text>
  </g>
</svg>
