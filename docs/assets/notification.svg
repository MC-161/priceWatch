<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Price Watch notification</title>
  <desc id="desc">A simple phone lock screen with one notification that a keyboard price dropped to £77.49.</desc>
  <rect x="30" y="6" width="360" height="328" rx="44" fill="#17191c"/>
  <rect x="36" y="12" width="348" height="316" rx="39" fill="#f3f4f2"/>
  <rect x="156" y="20" width="108" height="25" rx="13" fill="#17191c"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="210" y="83" text-anchor="middle" font-size="13" font-weight="550" fill="#646a72">Tuesday, 21 October</text>
    <text x="210" y="145" text-anchor="middle" font-size="58" font-weight="550" letter-spacing="-2" fill="#17191c">09:41</text>
    <rect x="52" y="174" width="316" height="126" rx="16" fill="#fff" stroke="#e4e6e3"/>
    <rect x="66" y="188" width="28" height="28" rx="7" fill="#17191c"/>
    <path d="M72 207L78 200L83 203L89 195" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="199" font-size="11.5" font-weight="700" letter-spacing=".65" fill="#343940">PRICE WATCH</text>
    <text x="352" y="199" text-anchor="end" font-size="11.5" fill="#8b9096">now</text>
    <text x="66" y="235" font-size="15" font-weight="650" fill="#17191c">Mechanical Keyboard</text>
    <text x="66" y="258" font-size="14" fill="#454b53">Price dropped to <tspan font-weight="700" fill="#267653">£77.49</tspan></text>
    <text x="66" y="280" font-size="12.5" fill="#777e86">Your £79.99 target was reached.</text>
    <rect x="52" y="310" width="88" height="4" rx="2" fill="#c7c9c7"/>
    <rect x="280" y="310" width="88" height="4" rx="2" fill="#c7c9c7"/>
  </g>
</svg>