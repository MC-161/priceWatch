<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Price Watch</title>
  <desc id="desc">A clean product banner showing a price threshold crossed once and one alert sent.</desc>
  <rect width="1280" height="360" rx="16" fill="#f7f8fa"/>
  <path d="M0 16Q0 0 16 0H1264Q1280 0 1280 16V344Q1280 360 1264 360H16Q0 360 0 344Z" fill="#f7f8fa"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="56" y="52" width="36" height="36" rx="10" fill="#17191c"/>
    <path d="M65 76L72 67L78 71L84 61" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106" y="76" font-size="17" font-weight="650" fill="#17191c">Price Watch</text>
    <text x="56" y="145" font-size="48" font-weight="650" letter-spacing="-1.8" fill="#17191c">Know when the price changes.</text>
    <text x="58" y="181" font-size="19" fill="#666d78">Reliable monitoring. One alert when your threshold is crossed.</text>
    <g font-size="13.5" font-weight="550">
      <circle cx="64" cy="226" r="4" fill="#267653"/>
      <text x="77" y="231" fill="#424852">Scheduled checks</text>
      <circle cx="226" cy="226" r="4" fill="#267653"/>
      <text x="239" y="231" fill="#424852">Exactly-once alerts</text>
      <circle cx="405" cy="226" r="4" fill="#267653"/>
      <text x="418" y="231" fill="#424852">Crash recovery</text>
    </g>
    <text x="58" y="307" font-size="12" font-weight="600" letter-spacing="1.5" fill="#8a9099">PRICE EVENT</text>
    <text x="58" y="331" font-size="15" fill="#17191c">£84.99 <tspan fill="#9298a1">→</tspan> <tspan font-weight="650" fill="#267653">£77.49</tspan></text>
  </g>
  <g>
    <rect x="716" y="36" width="508" height="288" rx="12" fill="#fff" stroke="#e5e7eb"/>
    <text x="744" y="68" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="650" letter-spacing="1.2" fill="#858b95">PRICE HISTORY</text>
    <text x="744" y="99" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="650" fill="#17191c">£77.49</text>
    <text x="854" y="98" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#267653">−8.8%</text>
    <g stroke="#eef0f2" stroke-width="1">
      <line x1="744" y1="130" x2="1196" y2="130"/>
      <line x1="744" y1="170" x2="1196" y2="170"/>
      <line x1="744" y1="210" x2="1196" y2="210"/>
      <line x1="744" y1="250" x2="1196" y2="250"/>
    </g>
    <line x1="744" y1="170" x2="1196" y2="170" stroke="#c68b35" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="1194" y="160" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#a36e20">£79.99 target</text>
    <path d="M750 142 L790 148 L830 138 L870 161 L910 166 L950 198 L990 188 L1030 217 L1070 205 L1110 238 L1150 244 L1190 255" fill="none" stroke="#267653" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1190" cy="255" r="4.5" fill="#267653" stroke="#fff" stroke-width="2"/>
    <rect x="1032" y="270" width="164" height="34" rx="7" fill="#eef6f0"/>
    <circle cx="1048" cy="287" r="3.5" fill="#267653"/>
    <text x="1058" y="291" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#245c40">1 alert sent</text>
  </g>
</svg>