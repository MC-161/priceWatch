<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Price Watch: a distributed scheduler with exactly-once alerting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect x="700" y="40" width="540" height="280" rx="14" fill="url(#grid)" opacity="0.7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="118" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Price Watch</text>
    <text x="66" y="166" font-size="23" fill="#94a3b8">A distributed scheduler that watches things</text>
    <text x="66" y="198" font-size="23" fill="#94a3b8">and tells you <tspan fill="#38bdf8" font-weight="600">exactly once</tspan> when something changes.</text>

    <g font-size="15" font-weight="600">
      <rect x="66" y="240" width="150" height="34" rx="17" fill="#0c4a6e"/>
      <text x="141" y="262" text-anchor="middle" fill="#7dd3fc">job claiming</text>
      <rect x="228" y="240" width="168" height="34" rx="17" fill="#14532d"/>
      <text x="312" y="262" text-anchor="middle" fill="#86efac">outbox delivery</text>
      <rect x="408" y="240" width="170" height="34" rx="17" fill="#4c1d95"/>
      <text x="493" y="262" text-anchor="middle" fill="#c4b5fd">crash recovery</text>
    </g>

    <!-- mini chart: price crosses the threshold once, one alert, later dips are silent -->
    <line x1="730" y1="200" x2="1210" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1210" y="190" text-anchor="end" font-size="14" fill="#fbbf24">threshold</text>

    <path d="M760 120 L800 135 L840 110 L880 150 L920 170 L960 215 L1000 205 L1040 225 L1080 195 L1120 210 L1160 230 L1200 220 L1200 300 L760 300 Z" fill="url(#area)"/>
    <path d="M760 120 L800 135 L840 110 L880 150 L920 170 L960 215 L1000 205 L1040 225 L1080 195 L1120 210 L1160 230 L1200 220" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

    <circle cx="947" cy="200" r="15" fill="#f59e0b" opacity="0.25"/>
    <circle cx="947" cy="200" r="7" fill="#f59e0b"/>
    <rect x="890" y="72" width="114" height="32" rx="8" fill="#f59e0b"/>
    <text x="947" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#1c1917">1 alert sent</text>
    <line x1="947" y1="104" x2="947" y2="186" stroke="#f59e0b" stroke-width="1.5"/>

    <circle cx="1092" cy="200" r="5" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="1092" y="268" text-anchor="middle" font-size="13" fill="#64748b">re-cross: silent</text>
    <line x1="1092" y1="207" x2="1092" y2="252" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
</svg>
