<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-label="Example 30-day price history: price falls below the threshold once, one alert is sent, two failed polls are stored as errors rather than zero">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="780" height="340" rx="14" fill="#0f172a"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="34" font-size="17" font-weight="700" fill="#f1f5f9">Mechanical Keyboard</text>
    <text x="24" y="54" font-size="12.5" fill="#64748b">GET /targets/1/history · 30 days · polled every 15 min · example target</text>
    <g font-size="12.5" font-weight="600">
      <rect x="560" y="20" width="96" height="40" rx="8" fill="#1e293b"/>
      <text x="608" y="36" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">lowest</text>
      <text x="608" y="53" text-anchor="middle" fill="#4ade80">£77.49</text>
      <rect x="664" y="20" width="96" height="40" rx="8" fill="#1e293b"/>
      <text x="712" y="36" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8">alerts sent</text>
      <text x="712" y="53" text-anchor="middle" fill="#fbbf24">1</text>
    </g>

    <!-- grid -->
    <g stroke="#1e293b" stroke-width="1">
      <line x1="60" y1="93" x2="730" y2="93"/>
      <line x1="60" y1="127" x2="730" y2="127"/>
      <line x1="60" y1="160" x2="730" y2="160"/>
      <line x1="60" y1="227" x2="730" y2="227"/>
      <line x1="60" y1="260" x2="730" y2="260"/>
    </g>
    <g font-size="11" fill="#64748b" text-anchor="end">
      <text x="52" y="97">£95</text>
      <text x="52" y="131">£90</text>
      <text x="52" y="164">£85</text>
      <text x="52" y="231">£75</text>
    </g>
    <g font-size="11" fill="#64748b" text-anchor="middle">
      <text x="60" y="280">21 Sep</text>
      <text x="283" y="280">1 Oct</text>
      <text x="507" y="280">11 Oct</text>
      <text x="730" y="280">21 Oct</text>
    </g>

    <!-- threshold -->
    <line x1="60" y1="193" x2="730" y2="193" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="64" y="186" font-size="11.5" fill="#fbbf24">£79.99 threshold</text>

    <!-- series (gaps = failed polls) -->
    <path d="M60 93 L105 93 L149 110 L194 110 L239 127 L283 127 L283 260 L60 260 Z" fill="url(#fill)"/>
    <path d="M328 127 L373 147 L417 160 L462 160 L507 210 L551 200 L551 260 L328 260 Z" fill="url(#fill)"/>
    <path d="M596 190 L641 203 L685 197 L730 210 L730 260 L596 260 Z" fill="url(#fill)"/>
    <g fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M60 93 L105 93 L149 110 L194 110 L239 127 L283 127"/>
      <path d="M328 127 L373 147 L417 160 L462 160 L507 210 L551 200"/>
      <path d="M596 190 L641 203 L685 197 L730 210"/>
    </g>

    <!-- failed polls -->
    <g stroke="#f87171" stroke-width="2.4" stroke-linecap="round">
      <path d="M300 121 L312 133 M312 121 L300 133"/>
      <path d="M568 194 L580 206 M580 194 L568 206"/>
    </g>
    <text x="306" y="110" text-anchor="middle" font-size="11" fill="#fca5a5">PARSE_ERROR</text>
    <text x="574" y="228" text-anchor="middle" font-size="11" fill="#fca5a5">FETCH_ERROR 429</text>

    <!-- alert -->
    <circle cx="492" cy="193" r="13" fill="#f59e0b" opacity="0.25"/>
    <circle cx="492" cy="193" r="6" fill="#f59e0b"/>
    <rect x="404" y="70" width="128" height="26" rx="7" fill="#f59e0b"/>
    <text x="468" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1917">alert sent · 10 Oct</text>
    <line x1="480" y1="96" x2="490" y2="180" stroke="#f59e0b" stroke-width="1.2"/>

    <text x="24" y="318" font-size="12" fill="#64748b">Failed polls leave a gap and never read as £0. Re-crossings after the alert stay silent until the price clears the reset band.</text>
  </g>
</svg>
